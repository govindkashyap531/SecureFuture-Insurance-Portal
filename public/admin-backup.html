<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecureFuture Admin Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
}

.navbar{
background:#0d6efd;
color:#fff;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar a{
color:#fff;
text-decoration:none;
}

.dashboard{
padding:25px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
font-size:35px;
color:#0d6efd;
margin:0;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
margin:5px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
margin-top:15px;
}

table th,
table td{
border:1px solid #ddd;
padding:12px;
text-align:center;
}

table th{
background:#0d6efd;
color:#fff;
}

input{
width:100%;
padding:10px;
margin:15px 0;
border:1px solid #ccc;
border-radius:5px;
}

</style>

</head>

<body>

<div class="navbar">

<h2>SecureFuture Admin</h2>

<a href="index.html">Home</a>

</div>

<div class="dashboard">

<div class="cards">

<div class="card">
<h2 id="users">0</h2>
<p>Total Users</p>
</div>

<div class="card">
<h2 id="policies">0</h2>
<p>Total Policies</p>
</div>

<div class="card">
<h2 id="leads">0</h2>
<p>Total Leads</p>
</div>

</div>

<h2>Recent Leads</h2>

<button onclick="exportTable()">
📥 Export CSV
</button>

<input
id="search"
type="text"
placeholder="Search by Name or Mobile..."
onkeyup="searchLead()">

<table>

<thead>

<tr>

<th>Name</th>
<th>Mobile</th>
<th>Email</th>
<th>Insurance</th>
<th>Date</th>
<th>Action</th>

</tr>

</thead>

<tbody id="leadTable">

</tbody>

</table>

</div>

<script>

.then(res=>res.json())
.then(data=>{
const token = localStorage.getItem("adminToken");

fetch("/admin/stats",{
headers:{
"Authorization":"Bearer "+token
}
})
.then(res=>res.json())
.then(data=>{
document.getElementById("users").innerHTML=data.users;
document.getElementById("policies").innerHTML=data.policies;
document.getElementById("leads").innerHTML=data.leads;

});

fetch("/lead/all")
.then(res=>res.json())
.then(data=>{

let html="";

data.forEach(lead=>{

html+=`
<tr>
<td>${lead.name}</td>
<td>${lead.mobile}</td>
<td>${lead.email}</td>
<td>${lead.insuranceType}</td>
<td>${new Date(lead.createdAt).toLocaleDateString()}</td>

<td>


<button onclick="deleteLead('${lead._id}')">🗑️</button><button onclick="editLead('${lead._id}')">✏️</button>

<button onclick="deleteLead('${lead._id}')">🗑️</button>

<button onclick="openWhatsApp('${lead.mobile}')">💬</button>
</td>

</tr>

`;

});

document.getElementById("leadTable").innerHTML=html;

});

function searchLead(){

let input=document.getElementById("search").value.toLowerCase();

let rows=document.querySelectorAll("#leadTable tr");

rows.forEach(row=>{

if(row.innerText.toLowerCase().includes(input)){
row.style.display="";
}else{
row.style.display="none";
}

});

}

function deleteLead(id){

if(confirm("Delete this lead?")){

fetch("/lead/delete/"+id,{
method:"DELETE"
})
.then(res=>res.json())
.then(data=>{
alert(data.message);
location.reload();
});

}

}

function editLead(id){

let name=prompt("Enter New Name");

if(!name) return;

fetch("/lead/update/"+id,{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({name:name})
})
.then(res=>res.json())
.then(data=>{
alert(data.message);
location.reload();
});

}

function exportTable(){

let csv="Name,Mobile,Email,Insurance,Date\n";

let rows=document.querySelectorAll("#leadTable tr");

rows.forEach(row=>{

let cols=row.querySelectorAll("td");

if(cols.length>=5){

csv+=
cols[0].innerText+","+
cols[1].innerText+","+
cols[2].innerText+","+
cols[3].innerText+","+
cols[4].innerText+"\n";

}

});

let blob=new Blob([csv],{type:"text/csv"});

let link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="SecureFuture_Leads.csv";

link.click();

}

function openWhatsApp(mobile){

window.open(
"https://wa.me/91"+mobile,
"_blank"
);

}
</script>

</body>
</html>
